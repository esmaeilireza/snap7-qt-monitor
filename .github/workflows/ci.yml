name: CI & Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libegl1 libgl1 libxkbcommon-x11-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install ruff

    - name: Static Code Analysis (Ruff)
      run: |
        ruff check . --select E9,F63,F7,F82

    - name: Syntax & UI Compilation Check
      shell: bash
      run: |
        python -m py_compile scada_dashboard.py fork_bridge.py sensor_simulator.py snap7_server.py test_bridge.py ui/*.py

    - name: Validate Simulation Pipeline
      shell: bash
      run: |
        # Verify that sensor simulation math and data models run without crashes
        python -c "from sensor_simulator import TemperatureSensorSimulator, SystemMetricsSimulator; t=TemperatureSensorSimulator(); s=SystemMetricsSimulator(); assert t.read() > 0; assert s.get_metrics()['cpu'] >= 0"