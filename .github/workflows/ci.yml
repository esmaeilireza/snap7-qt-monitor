name: CI & Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Static Code Analysis (Ruff)
      run: |
        # Check for syntax errors, undefined variables, and breaking runtime imports
        ruff check . --select E9,F63,F7,F82

    - name: Syntax & UI Compilation Check
      shell: bash
      run: |
        # Compile all root scripts and modular UI components
        python -m py_compile scada_dashboard.py fork_bridge.py sensor_simulator.py snap7_server.py test_bridge.py ui/*.py

    - name: Execute S7 Loopback Integration Test (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "[INFO] Starting local Mock S7 Server on port 102..."
        # Launch standalone mock server without dynamic random noise for deterministic assertions
        python snap7_server.py --no-dynamics &
        SERVER_PID=$!

        # Wait 3 seconds to allow socket binding and DB1 memory area registration
        sleep 3

        echo "[INFO] Running test_bridge.py verification suite..."
        python test_bridge.py --ip 127.0.0.1 --port 102 --rack 0 --slot 1
        TEST_EXIT=$?

        # Gracefully terminate background mock server process
        kill $SERVER_PID || true

        exit $TEST_EXIT
